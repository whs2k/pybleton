site_name: Pybleton — AI-Powered Ableton Live Control
site_url: https://whs2k.github.io/pybleton/
site_description: Modern Python SDK & FastMCP Server for Ableton Live. Connect AI Agents like Claude, Cursor, and Windsurf directly to your DAW.
site_author: Pybleton Core Team

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_javascript:
  - https://cdn.jsdelivr.net/npm/chart.js

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Live Usage & Ecosystem: analytics.md
  - SDK Guide: sdk.md
  - FastMCP Agent Integration: mcp.md
  - Cookbook & Demos: cookbook.md
